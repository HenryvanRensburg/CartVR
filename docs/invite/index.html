<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CartVR Family Invite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 390px;
      width: 100%;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 15px; color: #6b7280; margin: 0 0 18px; line-height: 1.5; }
    .code {
      display: inline-block;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      background: #ccfbf1;
      color: #134e4a;
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      background: #0f766e;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .btn-secondary {
      display: block;
      background: #f1f3f5;
      color: #111827;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CartVR Family Invite</h1>
    <p>Tap below to accept your invite and create your family login in CartVR.</p>
    <div id="codeBox" class="code">------</div>
    <a id="openBtn" class="btn" href="cartvr://invite">Open Invite in CartVR</a>
    <a class="btn-secondary" href="https://github.com/HenryvanRensburg/CartVR/releases/latest">First time? Download CartVR.apk</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = (params.get("code") || "").trim().toUpperCase();
      if (code) {
        document.getElementById("codeBox").textContent = code;
        var deepLink = "cartvr://invite/" + encodeURIComponent(code);
        document.getElementById("openBtn").href = deepLink;
        window.location.replace(deepLink);
      }
    })();
  </script>
</body>
</html>
